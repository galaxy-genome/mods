<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; background: #04060e; }
    a { color: #35e0f5; } a:hover { color: #ffffff; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="width: 360px; height: 740px; background: #04060e; color: #bcdbe6; font-family: Oxanium, 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden; ">
  <div style="height: 96px; position: relative; overflow: hidden; flex-shrink: 0;"><div style="display: flex; align-items: center; gap: 4px; padding: 6px 4px; background: #080f1e; border-bottom: 1px solid #16455a;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#bcdbe6" stroke-width="1.5" style="flex-shrink: 0;"><path d="M15 6l-6 6 6 6"></path></svg></div>
    <div style="display: flex; flex-direction: column; flex-grow: 1; gap: 1px;">
      <div style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: #5f7f8e;">Quest</div>
      <div style="font-size: 17px; font-weight: 600; color: #ffffff;">StoryAlt</div>
    </div>
    <div style="width: 8px; height: 8px; border-radius: 4px; background: #4fe08a;"></div><div style="width: 44px;"></div>
  </div><div style="padding: 14px 12px;"><div style="display: flex; align-items: center; justify-content: space-between;"><div style="font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: #5f7f8e;">Quest</div></div></div><div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(4,6,14,.7);"></div></div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; background: #080f1e; border-top: 1px solid #1e93a6; border-radius: 4px 4px 0 0; overflow: hidden;">
    <div style="display: flex; justify-content: center; padding: 8px 0 2px 0;"><div style="width: 36px; height: 4px; border-radius: 2px; background: #16455a;"></div></div>
    <div style="display: flex; align-items: center; padding: 4px 4px 4px 16px;">
      <div style="flex-grow: 1; font-size: 17px; font-weight: 600; color: #ffffff;">Problems</div>
      <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#bcdbe6" stroke-width="1.5" style="flex-shrink: 0;"><path d="M6 6l12 12M18 6L6 18"></path></svg></div>
    </div>
    <div style="padding: 0 16px 12px 16px;"><div style="display: flex; background: rgba(4,12,22,.9); border: 1px solid #16455a; border-radius: 2px; overflow: hidden;"><div style="height: 42px; flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600; background: rgba(53,224,245,.12); color: #35e0f5;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ff5a5a" stroke-width="1.8" style="flex-shrink: 0;"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16v.5"></path></svg>Errors<span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px;">0</span></div><div style="height: 42px; flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600; color: #bcdbe6; border-left: 1px solid #16455a;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffab3d" stroke-width="1.8" style="flex-shrink: 0;"><path d="M12 4l9 16H3z"></path><path d="M12 10v4M12 17v.5"></path></svg>Warnings<span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px;">0</span></div><div style="height: 42px; flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600; color: #bcdbe6; border-left: 1px solid #16455a;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#35e0f5" stroke-width="1.8" style="flex-shrink: 0;"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"></path></svg>Tips<span style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px;">0</span></div></div></div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; background-image: linear-gradient(rgba(23,113,128,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(23,113,128,.07) 1px, transparent 1px); background-size: 40px 40px;">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#4fe08a" stroke-width="1.2" style="flex-shrink: 0;"><circle cx="12" cy="12" r="9"></circle><path d="M8 12l3 3 5-6"></path></svg>
      <div style="font-size: 17px; font-weight: 600; color: #ffffff;">No problems</div>
      <div style="font-size: 14px; line-height: 1.45; color: #bcdbe6; text-align: center;">The game will load this quest as written. Test it once, then export.</div>
      <div style="height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 18px; border-radius: 2px; white-space: nowrap; font-size: 15px; font-weight: 600; border: 1px solid #35e0f5; color: #35e0f5;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#35e0f5" stroke-width="1.5" style="flex-shrink: 0;"><path d="M12 4v12M7 11l5 5 5-5M4 16v4h16v-4"></path></svg>Export</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
