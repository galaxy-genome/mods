<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  <style>
    body { margin: 0; background: #04060e; }
    a { color: #35e0f5; } a:hover { color: #ffffff; }
    * { box-sizing: border-box; }
  </style>
</helmet>
<div style="width: 360px; height: 740px; background: #04060e; color: #bcdbe6; font-family: Oxanium, 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden;">
<div style="display: flex; align-items: center; gap: 4px; padding: 6px 4px; background: #080f1e; border-bottom: 1px solid #16455a;">
  <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#bcdbe6" stroke-width="1.5"><path d="M15 6l-6 6 6 6"></path></svg></div>
  <div style="display: flex; flex-direction: column; flex-grow: 1; gap: 1px;"><div style="font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 11px; color: #5f7f8e;">Quest · EN</div><div style="font-size: 17px; font-weight: 600; color: #ffffff;">Parcel for Sirius</div></div>
  <div style="width: 8px; height: 8px; border-radius: 4px; background: #4fe08a;"></div><div style="height: 28px; display: flex; align-items: center; gap: 5px; padding: 0 8px; border: 1px solid #ff5a5a; border-radius: 2px; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: #ff5a5a;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ff5a5a" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16v.5"></path></svg>1</div>
  <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="#bcdbe6" stroke="none"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg></div>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; background-image: linear-gradient(rgba(23,113,128,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(23,113,128,.07) 1px, transparent 1px); background-size: 40px 40px;">
  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#177180" stroke-width="1.2"><path d="M8 6h12M8 12h12M8 18h12M4 6h.5M4 12h.5M4 18h.5"></path></svg>
  <div style="font-size: 17px; font-weight: 600; color: #ffffff;">No steps yet</div>
  <div style="font-size: 14px; line-height: 1.45; color: #bcdbe6; max-width: 280px;">A quest is a chain of steps. Each step shows dialogue, spawns ships, then waits for something to happen.</div>
  <div style="height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 18px; border-radius: 2px; font-size: 15px; font-weight: 600; background: #35e0f5; border: 1px solid #35e0f5; color: #04060e;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#04060e" stroke-width="1.5"><path d="M12 5v14M5 12h14"></path></svg>Add first step</div>
  <div style="display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 12px; color: #ff5a5a; padding-top: 8px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ff5a5a" stroke-width="1.5"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16v.5"></path></svg>A quest needs at least 2 steps or the game skips it.</div>
</div>
<div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #080f1e; border-top: 1px solid #16455a; padding: 4px 0 8px 0;"><div style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #5f7f8e;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5f7f8e" stroke-width="1.5"><circle cx="12" cy="12" r="8"></circle><path d="M12 11v5M12 8v.5"></path></svg>Overview</div><div style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #35e0f5;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#35e0f5" stroke-width="1.5"><path d="M8 6h12M8 12h12M8 18h12M4 6h.5M4 12h.5M4 18h.5"></path></svg>Steps</div><div style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #5f7f8e;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5f7f8e" stroke-width="1.5"><circle cx="6" cy="5" r="2"></circle><circle cx="6" cy="19" r="2"></circle><circle cx="18" cy="12" r="2"></circle><path d="M6 7v10M6 9c0 3 4 3 10 3"></path></svg>Flow</div><div style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #5f7f8e;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5f7f8e" stroke-width="1.5"><path d="M7 8h10M7 12h7M5 4h14v12h-6l-4 4v-4H5z"></path></svg>Rumors</div><div style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #5f7f8e;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5f7f8e" stroke-width="1.5"><path d="M8 5v14l11-7z"></path></svg>Test</div></div>
</div>
</x-dc>
</body>
</html>
