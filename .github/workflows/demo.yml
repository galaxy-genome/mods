name: README demo

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg webp
      - run: npm run demo
      - uses: actions/upload-artifact@v4
        with:
          name: demo
          path: demo-out/demo*.*
      - run: gh release upload demo demo-out/demo-dark.webp demo-out/demo.mp4 --clobber
        env:
          GH_TOKEN: ${{ github.token }}
